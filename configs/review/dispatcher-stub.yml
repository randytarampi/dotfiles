# Stable dispatcher stub: trigger parsing lives in the reusable workflow
# (randytarampi/dotfiles) at the immutable trusted ref __REF__.
# Only touch this file to add trigger events or change permissions.
name: Agent review dispatcher

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # A base-context label event retains publisher secrets for fork PRs.
  # Never run fork-authored code in the privileged dispatcher.
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event.sender.type != 'Bot'
    uses: randytarampi/dotfiles/.github/workflows/agentic-review.yml@__REF__
    with:
      event_json: ${{ toJson(github.event) }}
      trusted_ref: __REF__
    secrets: inherit
