[project]
name = "dotfiles"
version = "0.1.0"
description = "Personal dotfiles managed by chezmoi"
requires-python = ">=3.10"

[tool.poetry]
package-mode = false

[tool.poetry.group.test.dependencies]
pytest = "^9.1"
pytest-cov = "^6.0"

[tool.poetry.group.tooling.dependencies]
black = "^25.0"
PyYAML = "^6.0"

[tool.pytest.ini_options]
testpaths = "scripts/lib/tests"
addopts = "-q --cov=scripts --cov-branch --cov-report=lcov --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["scripts"]
omit = ["scripts/lib/tests/**"]
parallel = true
concurrency = ["multiprocessing"]

[tool.coverage.report]
# Ratchet — raise as coverage grows. Baseline remeasured with subprocess
# coverage enabled and test modules omitted from measurement.
# 2026-09-22: 36% measured (branch-aware pytest; Coveralls reports 33.71%
# line coverage). Floor 27 keeps ~9 points of headroom; 30+ is gated on
# representative tests (orchestration, failed/partial deploy paths), not
# wrapper-test padding.
fail_under = 27

[tool.black]
# Cap inferred targets: requires-python >=3.10 otherwise makes black infer
# py315, whose formatting the py3.14 safety check cannot parse (AGENTS.md
# gotcha). Repo floor is 3.10; tested on 3.10/3.11/3.14.
target-version = ["py310", "py311", "py312", "py313", "py314"]
