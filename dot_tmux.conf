# ~/.tmux.conf — managed by chezmoi (dotfiles repo)
# Do not edit directly; changes will be overwritten on `make deploy`.

# Extended keys are ON for pi and opencode so Shift+Enter / Ctrl+Enter /
# plain Enter arrive as distinct keys. tmux >= 3.5 should also use CSI-u,
# the most reliable modified-key format through tmux (pi docs:
# https://pi.dev/docs/latest/tmux, pi package docs/tmux.md). Enabling this
# also silences pi's "tmux extended-keys is off" startup warning.
#
# This reverses the earlier "off" guard: with iTerm2 3.6.x these settings
# broke Ctrl-key and cmd+return in iTerm2's tmux -CC integration; the
# machine now runs iTerm2 3.7.4, which no longer exhibits that. If tmux -CC
# regains key-breaking behaviour, flip extended-keys back to off (CSI-u
# needs tmux >= 3.5; tmux 3.2-3.4 keeps `on` only, xterm format).
set -g extended-keys on
set -g extended-keys-format csi-u