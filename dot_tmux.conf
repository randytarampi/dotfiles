# ~/.tmux.conf — managed by chezmoi (dotfiles repo)
# Do not edit directly; changes will be overwritten on `make deploy`.

# Keep extended-keys off. tmux 3.7c's CSI-u key encoding is incompatible with
# iTerm2 3.6.x's tmux -CC integration — enabling it breaks Ctrl-key and
# cmd+return. The Pi "extended-keys is off" warning is cosmetic and can be
# safely ignored.
set -g extended-keys off