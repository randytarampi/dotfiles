# Customizes the ephemeral environment used by Copilot code review and coding agents.
# MCP servers must also be configured in Settings → Copilot → MCP servers
# (GitHub-managed), including the local command `codegraph serve --mcp`.
# Secrets must use the COPILOT_MCP_* prefix. Settings instructions live in
# docs/AGENTIC-REVIEW.md.

name: Copilot setup steps

on:
  workflow_dispatch:

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Checkout trusted dotfiles scripts
        uses: actions/checkout@v7
        with:
          repository: randytarampi/dotfiles
          ref: main
          path: __TRUSTED_DOTFILES__
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Verify trusted codegraph script
        run: |
          test -f __TRUSTED_DOTFILES__/scripts/ci-codegraph.sh || {
            echo "Trusted dotfiles checkout is missing scripts/ci-codegraph.sh" >&2
            exit 1
          }
      - name: Cache codegraph index
        uses: actions/cache@v6
        with:
          path: .codegraph
          key: codegraph-${{ runner.os }}-${{ github.repository }}-${{ github.sha }}
          restore-keys: |
            codegraph-${{ runner.os }}-${{ github.repository }}-
      - name: Install codegraph + build index
        run: bash __TRUSTED_DOTFILES__/scripts/ci-codegraph.sh
