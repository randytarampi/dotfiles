# Stable dispatcher stub: the invocation tracks main so it cannot rot on a deleted ref;
# trusted_ref stays SHA-pinned to verified review assets; refresh it when the reusable
# workflow or configs/review assets change on main. The reusable workflow enforces 40-hex.
name: Agent review dispatcher

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # A base-context label event retains publisher secrets for fork PRs.
  # Never run fork-authored code in the privileged dispatcher.
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event.sender.type != 'Bot'
    uses: randytarampi/dotfiles/.github/workflows/agentic-review.yml@main
    with:
      event_json: ${{ toJson(github.event) }}
      trusted_ref: 13f8f7a7dd6ca84e8218dc486add731f8785c9ac
    secrets: inherit
