# Stable dispatcher stub: the invocation tracks main so it cannot rot on a deleted ref;
# trusted_ref stays SHA-pinned to verified review assets; refresh it when the reusable
# workflow or configs/review assets change on main. The reusable workflow enforces 40-hex.
name: Agent review dispatcher

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [labeled]

permissions:
  contents: read
  id-token: write
  pull-requests: write
  issues: write

jobs:
  review:
    if: github.event.sender.type != 'Bot'
    uses: randytarampi/dotfiles/.github/workflows/agentic-review.yml@b90cffa5b9ce97ef7dcd9f267d8fee9b0a77089a
    with:
      event_json: ${{ toJson(github.event) }}
      trusted_ref: 87a17ef5ed0cfd780efef3cbefa218b109d8d000
    secrets: inherit
