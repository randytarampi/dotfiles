# Stable dispatcher stub: trigger parsing lives in the reusable workflow
# (randytarampi/dotfiles) at the immutable trusted ref generated by onboard-agentic-review.py.
# Only touch this file to add trigger events or change permissions.
name: Agent review dispatcher

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: github.event.sender.type != 'Bot'
    uses: randytarampi/dotfiles/.github/workflows/agentic-review.yml@357760adfec47c4406b69869b660684c7616b9ea
    with:
      event_json: ${{ toJson(github.event) }}
      trusted_ref: 357760adfec47c4406b69869b660684c7616b9ea
    secrets: inherit
