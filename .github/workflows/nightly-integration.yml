name: Nightly integration

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-gate:
    name: Real gate (${{ matrix.gate }})
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Configuration-only families: each has a postcondition below. Package
        # installs (Pi, Mozart), unavailable-prerequisite probes (CodeGraph),
        # services, security hardening, and system-default families are excluded.
        include:
          - gate: DOTFILES_RUN_OPENCODE_SETUP
          - gate: DOTFILES_RUN_MCP_SETUP
          - gate: DOTFILES_RUN_AGENT_GUIDANCE_SETUP
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install nightly tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y make
          curl -fsSL https://get.chezmoi.io | sh -s -- -b "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Prepare fresh home and single-gate environment
        run: |
          mkdir -p "$RUNNER_TEMP/dotfiles-home"
          echo "HOME=$RUNNER_TEMP/dotfiles-home" >> "$GITHUB_ENV"
          echo "USERPROFILE=$RUNNER_TEMP/dotfiles-home" >> "$GITHUB_ENV"
          cp dot_dotfiles/shell/.env.example "$RUNNER_TEMP/dotfiles-home/.env"
          printf '%s=1\n' '${{ matrix.gate }}' >> "$RUNNER_TEMP/dotfiles-home/.env"
          # No pre-existing ~/.config/chezmoi: each matrix entry is fresh.
      - name: Run canonical deploy path
        run: make deploy
      - name: Verify gate postcondition
        shell: bash
        run: |
          case '${{ matrix.gate }}' in
            DOTFILES_RUN_OPENCODE_SETUP)
              artifact="$HOME/.config/opencode/opencode.json"
              test -s "$artifact" || { echo "Missing $artifact" >&2; exit 1; }
              python3 -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); assert isinstance(d, dict) and bool(d), "empty OpenCode document"' "$artifact"
              ;;
            DOTFILES_RUN_MCP_SETUP)
              artifact="$HOME/.config/opencode/opencode.json"
              test -s "$artifact" || { echo "Missing $artifact" >&2; exit 1; }
              # Check the actual generated MCP registration, not just a file
              # which may be generated by a different gate.
              python3 -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); m=d.get("mcp", {}); m=m.get("servers", m) if isinstance(m, dict) else {}; entry=m.get("basic-memory") if isinstance(m, dict) else None; cmd=entry.get("command") if isinstance(entry, dict) else None; assert isinstance(cmd, list) and len(cmd) > 1 and cmd[0] == "uvx" and "basic-memory" in cmd, "invalid Basic Memory MCP"' "$artifact"
              ;;
            DOTFILES_RUN_AGENT_GUIDANCE_SETUP)
              artifact="$HOME/AGENTS.md"
              test -s "$artifact" || { echo "Missing $artifact" >&2; exit 1; }
              grep -q '<!-- AGENT_GUIDANCE_START -->' "$artifact" || {
                echo "Missing guidance markers in $artifact" >&2
                exit 1
              }
              grep -q '<!-- AGENT_GUIDANCE_END -->' "$artifact" || {
                echo "Missing guidance markers in $artifact" >&2
                exit 1
              }
              ;;
            *) echo "No postcondition registered for ${{ matrix.gate }}" >&2; exit 1 ;;
          esac
      - name: Record gate result
        if: always()
        run: |
          mkdir -p nightly-results
          printf 'gate=%s\nresult=%s\n' '${{ matrix.gate }}' '${{ job.status }}' > "nightly-results/${{ matrix.gate }}.txt"
      - name: Upload gate result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-result-${{ matrix.gate }}
          path: nightly-results/

  report:
    name: Nightly gate report
    if: always()
    needs: real-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download matrix results
        continue-on-error: true  # Missing artifacts are marked DEGRADED in the reporter.
        uses: actions/download-artifact@v8
        with:
          pattern: nightly-result-*
          path: nightly-results
          merge-multiple: true
      - name: Write truthful report (stabilization period)
        run: |
          python3 .github/scripts/nightly_gate_report.py \
            --results nightly-results \
            --summary "$GITHUB_STEP_SUMMARY" \
            --json "$RUNNER_TEMP/nightly-gate-report.json"
      - name: Upload aggregate report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-aggregate-report
          path: ${{ runner.temp }}/nightly-gate-report.json
          if-no-files-found: error
