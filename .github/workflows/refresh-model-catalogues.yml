name: Refresh model catalogues

on:
  issue_comment:
    types: [created]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      trusted_ref:
        description: "Immutable 40-hex commit containing the trusted catalogue workflow"
        required: true
        type: string

permissions:
  contents: read

jobs:
  refresh:
    # Filter the owner-only issue command before entering the secret-bearing job.
    if: >-
      github.event_name != 'issue_comment' ||
      (
        github.actor == github.repository_owner &&
        github.event.issue.number == 197 &&
        github.event.issue.pull_request == null &&
        github.event.comment.body == '/refresh-model-catalogues'
      )
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.catalogue_status.outputs.status }}
    permissions:
      contents: read
    env:
      TRUSTED_REF: ${{ inputs.trusted_ref }}
      TRUSTED_SHA: ${{ inputs.trusted_ref || github.sha }}
    steps:
      - name: Validate the trusted manual dispatch boundary
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TRUSTED_REF: ${{ inputs.trusted_ref }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
          COMMENT_ISSUE: ${{ github.event.issue.number || '' }}
          COMMENT_IS_PR: ${{ github.event.issue.pull_request != null }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            test "${GITHUB_ACTOR}" = "${GITHUB_REPOSITORY_OWNER}"
            test "${GITHUB_REF_NAME}" = "${DEFAULT_BRANCH}"
            test -n "${TRUSTED_REF}"
            if [[ ${#TRUSTED_SHA} -ne 40 || "${TRUSTED_SHA}" == *[!0-9a-f]* ]]; then
              echo "::error::Invalid manually supplied trusted_ref SHA" >&2
              exit 1
            fi
            # An arbitrary 40-hex PR SHA must not become secret-bearing code.
            default_sha="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${DEFAULT_BRANCH}" \
              --jq '.commit.sha')"
            if [[ ${#default_sha} -ne 40 || "${default_sha}" == *[!0-9a-f]* ]]; then
              echo "::error::Invalid default-branch head SHA" >&2
              exit 1
            fi
            ancestry="$(gh api \
              "repos/${GITHUB_REPOSITORY}/compare/${TRUSTED_SHA}...${default_sha}" \
              --jq '.status')"
            if [[ "${ancestry}" != "ahead" && "${ancestry}" != "identical" ]]; then
              echo "::error::Manual trusted_ref is not on default-branch history" >&2
              exit 1
            fi
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "issue_comment" ]]; then
            test "${GITHUB_ACTOR}" = "${GITHUB_REPOSITORY_OWNER}"
            test "${GITHUB_REF_NAME}" = "${DEFAULT_BRANCH}"
            test "${COMMENT_ISSUE}" = "197"
            test "${COMMENT_IS_PR}" = "false"
            test "${COMMENT_BODY}" = "/refresh-model-catalogues"
            test -z "${TRUSTED_REF}"
            test "${TRUSTED_SHA}" = "${GITHUB_SHA}"
          fi
          if [[ ${#TRUSTED_SHA} -ne 40 || "${TRUSTED_SHA}" == *[!0-9a-f]* ]]; then
            echo "::error::Invalid trusted checkout SHA" >&2
            exit 1
          fi

      - name: Check out the triggering commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TRUSTED_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Refresh review-only free-model candidates
        id: refresh_catalogue
        continue-on-error: true
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: python3 scripts/refresh-model-catalogues.py

      - name: Classify catalogue refresh result
        id: catalogue_status
        if: always()
        env:
          REFRESH_OUTCOME: ${{ steps.refresh_catalogue.outcome }}
        run: |
          set -euo pipefail
          status="$(jq -r '.status // empty' artifacts/model-catalogues/free-model-candidates.json)"
          [[ -n "${status}" ]]
          printf 'status=%s\n' "${status}" >> "${GITHUB_OUTPUT}"
          if [[ "${status}" == "unavailable" ]]; then
            exit 0
          fi
          [[ "${REFRESH_OUTCOME}" == "success" ]]

      - name: Upload the catalogue artifact
        uses: actions/upload-artifact@v7
        with:
          name: model-catalogue-${{ github.run_id }}
          path: artifacts/model-catalogues/free-model-candidates.json
          if-no-files-found: error

  publish:
    needs: refresh
    if: needs.refresh.result == 'success' && needs.refresh.outputs.status == 'available'
    runs-on: ubuntu-latest
    environment: model-catalogue-publish
    permissions:
      contents: read
      pull-requests: read
    env:
      TRUSTED_REF: ${{ inputs.trusted_ref }}
      TRUSTED_SHA: ${{ inputs.trusted_ref || github.sha }}
    steps:
      - name: Validate publication inputs
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TRUSTED_REF: ${{ inputs.trusted_ref }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
          COMMENT_ISSUE: ${{ github.event.issue.number || '' }}
          COMMENT_IS_PR: ${{ github.event.issue.pull_request != null }}
        run: |
          set -euo pipefail
          publish_branch="model-catalogue-bot/inventory"
          [[ "${publish_branch}" =~ ^model-catalogue-bot/[a-z0-9-]+$ ]]
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            test "${GITHUB_ACTOR}" = "${GITHUB_REPOSITORY_OWNER}"
            test "${GITHUB_REF_NAME}" = "${DEFAULT_BRANCH}"
            test -n "${TRUSTED_REF}"
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "issue_comment" ]]; then
            test "${GITHUB_ACTOR}" = "${GITHUB_REPOSITORY_OWNER}"
            test "${GITHUB_REF_NAME}" = "${DEFAULT_BRANCH}"
            test "${COMMENT_ISSUE}" = "197"
            test "${COMMENT_IS_PR}" = "false"
            test "${COMMENT_BODY}" = "/refresh-model-catalogues"
            test -z "${TRUSTED_REF}"
            test "${TRUSTED_SHA}" = "${GITHUB_SHA}"
          fi
          if [[ ${#TRUSTED_SHA} -ne 40 || "${TRUSTED_SHA}" == *[!0-9a-f]* ]]; then
            echo "::error::Invalid trusted publishing SHA" >&2
            exit 1
          fi

      - name: Check out the exact base commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TRUSTED_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Download the catalogue artifact
        uses: actions/download-artifact@v8
        with:
          name: model-catalogue-${{ github.run_id }}
          path: "${{ runner.temp }}/model-catalogue"

      - name: Record the current bot branch tip
        run: |
          set -euo pipefail
          publish_branch="model-catalogue-bot/inventory"
          remote_tip="$(git ls-remote --heads origin "refs/heads/${publish_branch}" | awk 'NR == 1 { print $1 }')"
          if [[ -n "${remote_tip}" ]]; then
            [[ "${remote_tip}" =~ ^[0-9a-f]{40}$ ]]
            git fetch --no-tags origin "refs/heads/${publish_branch}"
            test "$(git rev-parse FETCH_HEAD)" = "${remote_tip}"
            printf 'BOT_BRANCH_EXISTS=true\n' >> "${GITHUB_ENV}"
            printf 'BOT_BRANCH_EXPECTED_TIP=%s\n' "${remote_tip}" >> "${GITHUB_ENV}"
          else
            printf 'BOT_BRANCH_EXISTS=false\n' >> "${GITHUB_ENV}"
            printf 'BOT_BRANCH_EXPECTED_TIP=\n' >> "${GITHUB_ENV}"
          fi

      - name: Validate and stage the exact artifact path
        run: |
          set -euo pipefail
          allowed_path="artifacts/model-catalogues/free-model-candidates.json"
          artifact_path="${RUNNER_TEMP}/model-catalogue/free-model-candidates.json"
          test -f "${artifact_path}"
          test "$(git rev-parse HEAD)" = "${TRUSTED_SHA}"
          mkdir -p "$(dirname "${allowed_path}")"
          cp "${artifact_path}" "${allowed_path}"
          mapfile -t changed_paths < <(
            { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u
          )
          ((${#changed_paths[@]} == 1))
          [[ "${changed_paths[0]}" == "${allowed_path}" ]]
          git add -- "${allowed_path}"
          if ! git diff --cached --raw | awk '$2 ~ /^160000$/ || $3 ~ /^160000$/ { found=1 } END { exit found }'; then
            echo "Refusing to stage a gitlink (mode 160000)." >&2
            exit 1
          fi
          if ! git ls-files --stage | awk '$1 == "160000" { found=1 } END { exit found }'; then
            echo "Refusing to publish a tree containing a gitlink (mode 160000)." >&2
            exit 1
          fi

      - name: Prepare a template-compliant candidate review
        run: |
          set -euo pipefail
          previous="${RUNNER_TEMP}/previous-candidates.json"
          if [[ "${BOT_BRANCH_EXISTS}" == "true" ]]; then
            [[ "${BOT_BRANCH_EXPECTED_TIP}" =~ ^[0-9a-f]{40}$ ]]
            # Read old bot inventory only as data for the one-time PR #200 migration.
            if git cat-file -e "${BOT_BRANCH_EXPECTED_TIP}:artifacts/model-catalogues/free-model-candidates.json" 2>/dev/null; then
              git show "${BOT_BRANCH_EXPECTED_TIP}:artifacts/model-catalogues/free-model-candidates.json" > "${previous}"
            elif git cat-file -e "${BOT_BRANCH_EXPECTED_TIP}:artifacts/model-catalogues/opencode-zen-free.json" 2>/dev/null; then
              git show "${BOT_BRANCH_EXPECTED_TIP}:artifacts/model-catalogues/opencode-zen-free.json" > "${previous}"
            fi
          fi
          args=(--current "artifacts/model-catalogues/free-model-candidates.json"
                --output "${RUNNER_TEMP}/model-catalogue/review-pr.md")
          if [[ -f "${previous}" ]]; then
            args+=(--previous "${previous}")
          fi
          python3 scripts/lib/catalogue_review.py "${args[@]}"

      - name: Validate GitHub App publication credentials
        env:
          HAS_APP_CLIENT_ID: ${{ vars.WOOFDY_GITHUB_APP_CLIENT_ID != '' }}
          HAS_APP_PRIVATE_KEY: ${{ secrets.WOOFDY_GITHUB_APP_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          if [[ "${HAS_APP_CLIENT_ID}" != "true" || "${HAS_APP_PRIVATE_KEY}" != "true" ]]; then
            echo "::error title=Missing GitHub App publication credentials::Configure WOOFDY_GITHUB_APP_CLIENT_ID as an Actions variable and WOOFDY_GITHUB_APP_PRIVATE_KEY as an environment secret for model-catalogue-publish. See docs/MODEL_UPDATES.md#publishing-credentials-and-recovery."
            exit 1
          fi

      - id: publish_app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.WOOFDY_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.WOOFDY_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Publish the bot branch and create or update its draft PR
        env:
          GH_TOKEN: ${{ steps.publish_app_token.outputs.token }}
          GIT_TERMINAL_PROMPT: "0"
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # One stable branch and one open draft PR make semantically equivalent
          # catalogue updates idempotent across sequential or concurrent runs.
          publish_branch="model-catalogue-bot/inventory"
          [[ "${publish_branch}" =~ ^model-catalogue-bot/[a-z0-9-]+$ ]]
          # A bot branch can have a human-promoted or differently owned PR.
          # Never republish into a non-draft, foreign or differently based PR.
          existing_prs="$(gh pr list --head "${publish_branch}" --state open \
            --limit 2 --json number,isDraft,baseRefName,headRefName,author)"
          if (( $(jq 'length' <<< "${existing_prs}") > 1 )); then
            echo "::error::Multiple open PRs found on catalogue branch" >&2
            exit 1
          fi
          existing_pr="$(jq -r '.[0].number // empty' <<< "${existing_prs}")"
          # A closed draft may be recreated only from a known bot-produced tip.
          # Never force-overwrite a human-owned branch with no open PR.
          if [[ "${BOT_BRANCH_EXISTS}" == "true" && -z "${existing_pr}" ]]; then
            bot_email="$(git show -s --format='%ae' "${BOT_BRANCH_EXPECTED_TIP}")"
            bot_subject="$(git show -s --format='%s' "${BOT_BRANCH_EXPECTED_TIP}")"
            # Historical #200 revision is a one-time, immutable exception.
            legacy_tip="6fbf14bfeec1222b0ae376b500e1888384a26e4d"
            current_bot="353209076+woofdy-randytarampi-ca[bot]@users.noreply.github.com"
            current_subject="chore(agents): refresh free-model candidate inventory"
            if [[ "${BOT_BRANCH_EXPECTED_TIP}" != "${legacy_tip}" ]] &&
              [[ "${bot_email}:${bot_subject}" != "${current_bot}:${current_subject}" ]]; then
              echo "::error::Catalogue branch has no open PR and an unrecognised commit" >&2
              exit 1
            fi
            if ! git cat-file -e "${BOT_BRANCH_EXPECTED_TIP}:artifacts/model-catalogues/free-model-candidates.json" 2>/dev/null &&
              ! git cat-file -e "${BOT_BRANCH_EXPECTED_TIP}:artifacts/model-catalogues/opencode-zen-free.json" 2>/dev/null; then
              echo "::error::Catalogue branch has no recognised inventory" >&2
              exit 1
            fi
          fi
          if [[ -n "${existing_pr}" ]] &&
            ! jq -e --arg base "${DEFAULT_BRANCH}" \
              --arg head "${publish_branch}" \
              --arg author "woofdy-randytarampi-ca[bot]" \
              '.[0] | (.isDraft == true) and (.baseRefName == $base) and
                (.headRefName == $head) and (.author.login == $author)' \
              <<< "${existing_prs}" >/dev/null; then
            echo "::error::Refusing to update a non-draft or foreign catalogue PR" >&2
            exit 1
          fi
          # Preserve an existing draft when the only differences are observation times.
          # This check is deliberately after the exact artifact-path and gitlink
          # allowlists; do not skip those checks on repeated runs.
          if [[ "${BOT_BRANCH_EXISTS}" == "true" ]]; then
            [[ "${BOT_BRANCH_EXPECTED_TIP}" =~ ^[0-9a-f]{40}$ ]]
            # existing_pr was validated before any no-op or publication.
            if [[ -n "${existing_pr}" ]] &&
              git cat-file -e "${BOT_BRANCH_EXPECTED_TIP}:artifacts/model-catalogues/free-model-candidates.json" 2>/dev/null; then
              old_semantics="$(git show "${BOT_BRANCH_EXPECTED_TIP}:artifacts/model-catalogues/free-model-candidates.json" |
                jq -cS 'del(.fetched_at, .pricing_observed_at, .pricing_expires_at)')"
              new_semantics="$(jq -cS 'del(.fetched_at, .pricing_observed_at, .pricing_expires_at)'                 artifacts/model-catalogues/free-model-candidates.json)"
              if [[ "${old_semantics}" == "${new_semantics}" ]]; then
                # A previous push may have succeeded before gh pr edit failed.
                # Repair stale PR metadata without changing the branch SHA.
                review_body="${RUNNER_TEMP}/model-catalogue/review-pr.md"
                expected_title="chore(agents): review free-model candidates"
                expected_marker="$(grep -E '^<!-- free-model-review-sha256: [0-9a-f]{64} -->$' "${review_body}")"
                test -n "${expected_marker}"
                actual_pr="$(gh pr view "${existing_pr}" --json title,body)"
                if jq -e --arg title "${expected_title}" --arg marker "${expected_marker}" '
                  .title == $title and (.body |
                    contains($marker) and
                    contains("## Outcome and scope") and
                    contains("## Contributors and roles") and
                    contains("## Evidence") and
                    contains("## Review disposition") and
                    contains("## Risk and handoff"))
                ' <<< "${actual_pr}" >/dev/null; then
                  echo "Catalogue unchanged apart from observation times; preserving existing draft PR."
                else
                  gh pr edit "${existing_pr}" --title "${expected_title}" --body-file "${review_body}"
                  echo "Repaired stale catalogue PR metadata without changing the bot branch."
                fi
                exit 0
              fi
            fi
          fi
          # ID 353209076 is the verified WOOFDY App author of PR #200.
          bot_login="woofdy-randytarampi-ca[bot]"
          git config user.name "${bot_login}"
          git config user.email "353209076+${bot_login}@users.noreply.github.com"
          git commit -m "chore(agents): refresh free-model candidate inventory"
          if [[ "${BOT_BRANCH_EXISTS}" == "true" ]]; then
            [[ "${BOT_BRANCH_EXPECTED_TIP}" =~ ^[0-9a-f]{40}$ ]]
          fi
          git fetch --no-tags origin "refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          # Candidate partitions are computed from the trusted commit's registry.
          # Fail closed if main changed it before this bot PR is published.
          trusted_registry="$(git rev-parse HEAD:configs/opencode/opencode-models.json)"
          latest_registry="$(git rev-parse "origin/${DEFAULT_BRANCH}:configs/opencode/opencode-models.json")"
          if [[ "${trusted_registry}" != "${latest_registry}" ]]; then
            echo "::error::Curated model registry changed during refresh; rerun against current main" >&2
            exit 1
          fi
          mapfile -t published_paths < <(git diff --name-only "origin/${DEFAULT_BRANCH}...HEAD")
          ((${#published_paths[@]} == 1))
          [[ "${published_paths[0]}" == "artifacts/model-catalogues/free-model-candidates.json" ]]
          if ! git diff --raw "origin/${DEFAULT_BRANCH}...HEAD" | awk '$2 ~ /^160000$/ || $3 ~ /^160000$/ { found=1 } END { exit found }'; then
            echo "Refusing to publish a commit containing a gitlink (mode 160000)." >&2
            exit 1
          fi
          git -c credential.helper='!gh auth git-credential' push \
            --force-with-lease="refs/heads/${publish_branch}:${BOT_BRANCH_EXPECTED_TIP}" \
            origin "HEAD:refs/heads/${publish_branch}"
          # Reuse the preflight-validated PR number; do not select another PR.
          review_body="${RUNNER_TEMP}/model-catalogue/review-pr.md"
          test -s "${review_body}"
          if [[ -n "${existing_pr}" ]]; then
            gh pr edit "${existing_pr}" --title "chore(agents): review free-model candidates" --body-file "${review_body}"
          else
            gh pr create --draft --base "${DEFAULT_BRANCH}" --head "${publish_branch}" \
              --title "chore(agents): review free-model candidates" --body-file "${review_body}"
          fi
