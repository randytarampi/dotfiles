name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Poetry must be on PATH before setup-python: the action's cache: poetry
      # mode invokes poetry to derive cache keys, so install it first (pinned
      # to the poetry.lock generator version).
      - name: Install Poetry (before setup-python)
        run: |
          if command -v pipx >/dev/null 2>&1; then
            pipx install poetry==2.4.3
          else
            python -m pip install poetry==2.4.3
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: poetry
      - name: Install macOS tooling
        if: runner.os == 'macOS'
        run: brew install actionlint shellcheck shfmt chezmoi
      - name: Install Ubuntu tooling
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # actionlint is not in Ubuntu's apt repositories — install the pinned
          # upstream release binary instead.
          sudo apt-get install -y shellcheck shfmt
          mkdir -p "$HOME/bin"
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12 "$HOME/bin"
          curl -fsSL https://get.chezmoi.io | sh -s -- -b "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Prepare empty environment
        run: cp dot_dotfiles/shell/.env.example "$HOME/.env"
      - name: Install Python test dependencies
        run: |
          if command -v pipx >/dev/null 2>&1; then
            pipx install poetry==2.4.3
          else
            python -m pip install poetry==2.4.3
          fi
          poetry install --with test,tooling
      - name: CI verification
        run: make ci-verify
      - name: Python tests
        run: make test
      - name: Upload coverage
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: coverage.lcov
          format: lcov
          parallel: true
          flag-name: ${{ matrix.os }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}

  deploy:
    name: Deploy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows lane promoted to required after three consecutive green runs
    # (5e48340, 389ab47, f237cb6) following the chezmoi 2.72.2 +
    # interpreters + cygpath fixes; the portability probe period is over.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install deploy tooling (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y make
          curl -fsSL https://get.chezmoi.io | sh -s -- -b "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Install deploy tooling (macOS)
        if: runner.os == 'macOS'
        run: brew install chezmoi make
      - name: Install deploy tooling (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Git checkout supplies Git Bash; make is an explicit pinned dep.
          # chezmoi is installed in the next step via the official installer
          # pinned to v2.72.2: choco's 2.68.0 predates the repo's
          # minimumVersion 2.70.2 and does not honour the interpreters
          # configuration (observed: raw fork/exec of .sh scripts failed
          # identically across runs 1-3).
          choco install make --version=4.4.1 --no-progress -y
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\bin" | Out-Null
      - name: Install chezmoi (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -fsSL https://get.chezmoi.io | bash -s -- -b "$RUNNER_TEMP/bin" -t v2.72.2
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Configure chezmoi script interpreter (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Windows cannot exec .sh scripts directly ("not a valid Win32
          # application"); chezmoi routes scripts through the interpreter
          # configured for the script extension. Point .sh at Git Bash and hand
          # the config to chezmoi via the CHEZMOI make-variable override
          # (Makefile:11 uses ?=, so the environment wins). The config path
          # must be forward-slashed: a backslashed RUNNER_TEMP path is
          # unquoted in the make recipe, so bash strips the backslash escapes
          # and chezmoi silently proceeds without the config (runs 1-4).
          cat > "$RUNNER_TEMP/chezmoi-interpreters.toml" <<'EOF'
          [interpreters.sh]
              command = 'C:\Program Files\Git\bin\bash.exe'
          EOF
          cz_config="$(cygpath -m "$RUNNER_TEMP")/chezmoi-interpreters.toml"
          echo "CHEZMOI=chezmoi --config $cz_config" >> "$GITHUB_ENV"
      - name: Prepare fresh home and empty environment
        shell: bash
        run: |
          # Ephemeral runners are isolated; this also makes the HOME/state-dir contract explicit.
          mkdir -p "$RUNNER_TEMP/dotfiles-home"
          echo "HOME=$RUNNER_TEMP/dotfiles-home" >> "$GITHUB_ENV"
          echo "USERPROFILE=$RUNNER_TEMP/dotfiles-home" >> "$GITHUB_ENV"
          cp dot_dotfiles/shell/.env.example "$RUNNER_TEMP/dotfiles-home/.env"
          rm -rf "$RUNNER_TEMP/dotfiles-home/.config/chezmoi"
      - name: Deploy (first pass)
        shell: bash
        run: make deploy
      - name: Deploy (idempotency pass)
        shell: bash
        run: make deploy
      - name: Chezmoi no-op check
        shell: bash
        run: |
          # Verify with the same effective configuration the deploy passes
          # used: CHEZMOI carries the Windows interpreters --config override
          # and must word-split (unquoted) into its three words — quoting it
          # turns the whole string into one command name and exits 127
          # (observed on run 6). The value is workflow-controlled.
          ${CHEZMOI:-chezmoi} --source "$GITHUB_WORKSPACE" verify
          if ! diff_output="$(${CHEZMOI:-chezmoi} --source "$GITHUB_WORKSPACE" diff)"; then
            echo "chezmoi diff command failed" >&2
            exit 1
          fi
          if [[ -n "$diff_output" ]]; then
            printf 'chezmoi reports drift after the idempotency pass:\n%s\n' "$diff_output" >&2
            exit 1
          fi
      # make doctor is currently meaningful on Unix; Windows is a deliberate
      # allow-failure portability probe for bash/path incompatibilities.
      - name: Doctor (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: make doctor

  finish:
    needs: verify
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Finish coverage upload
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          parallel-finished: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}

  # Stable aggregate check for future branch rules: this job name must never
  # change (rulesets reference it by name). It gates on every predecessor's
  # result — unlike finish, whose if: always() makes its success meaningless
  # as a required signal.
  ci-required:
    name: ci/required
    needs: [verify, deploy, finish]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check aggregate results
        run: |
          results='${{ toJSON(needs.*.result) }}'
          echo "Needs results: $results"
          if printf '%s' "$results" | grep -qE 'failure|cancelled|skipped'; then
            echo "ci/required: one or more required jobs did not succeed" >&2
            exit 1
          fi
          echo "ci/required: all required jobs succeeded"
