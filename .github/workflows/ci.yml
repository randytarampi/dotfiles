name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install macOS tooling
        if: runner.os == 'macOS'
        run: brew install shellcheck shfmt chezmoi
      - name: Install Ubuntu tooling
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt
          curl -fsSL https://get.chezmoi.io | sh -s -- -b "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Prepare empty environment
        run: cp dot_dotfiles/shell/.env.example "$HOME/.env"
      - name: Install Python test dependencies
        run: python -m venv .venv && .venv/bin/python -m pip install -r requirements-dev.txt
      - name: CI verification
        run: make ci-verify
      - name: Python tests
        run: make test
      - name: Deploy smoke
        run: make deploy
