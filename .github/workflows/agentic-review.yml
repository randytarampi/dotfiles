# Reusable agentic review workflow.
#
# Caller example:
#   jobs:
#     review:
#       uses: randytarampi/dotfiles/.github/workflows/agentic-review.yml@main
#       secrets: inherit
#
# Labels: review-opencode, review-junie, review-gemini, review-copilot, and
# review-all request the corresponding reviewer(s). Mention triggers are parsed
# by caller dispatch workflows; dispatcher-mode parsing is centralized here.
# trigger_tokens is comma-separated and aligned with agents for standardized messaging.
# Optional *_BOT_TOKEN secrets let each lane post as a distinct GitHub user; without
# them, notifications use github-actions[bot].

name: Agentic review

on:
  workflow_call:
    inputs:
      agents:
        description: "Comma-separated subset of: opencode,junie,gemini,copilot"
        required: false
        type: string
        default: "opencode,junie,gemini"
      prompt:
        description: "Extra prompt context for reviewers"
        required: false
        type: string
        default: ""
      pr_number:
        description: "PR number to review"
        required: false
        type: string
        default: ""
      trigger_tokens:
        description: "Comma-separated trigger tokens aligned with agents"
        required: false
        type: string
        default: ""
      event_json:
        description: "Raw caller event JSON for dispatcher-mode invocation"
        required: false
        type: string
        default: ""
    secrets:
      OPENCODE_API_KEY:
        required: false
      JUNIE_API_KEY:
        required: false
      GEMINI_API_KEY:
        required: false
      OPENROUTER_API_KEY:
        required: false
      JUNIE_BOT_TOKEN:
        required: false
      OPENCODE_BOT_TOKEN:
        required: false
      GEMINI_BOT_TOKEN:
        required: false
      JUNIE_APP_ID:
        required: false
      JUNIE_APP_PRIVATE_KEY:
        required: false
      OPENCODE_APP_ID:
        required: false
      OPENCODE_APP_PRIVATE_KEY:
        required: false
      GEMINI_APP_ID:
        required: false
      GEMINI_APP_PRIVATE_KEY:
        required: false
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false

concurrency:
  group: agentic-review-${{ inputs.pr_number || github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  parse:
    if: inputs.event_json == '' || github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    outputs:
      agents: ${{ steps.parse.outputs.agents }}
      prompt: ${{ steps.parse.outputs.prompt }}
      pr_number: ${{ steps.parse.outputs.pr_number }}
      tokens: ${{ steps.parse.outputs.tokens }}
    steps:
      - name: Parse review request
        id: parse
        env:
          EVENT_JSON: ${{ inputs.event_json }}
          INPUT_AGENTS: ${{ inputs.agents }}
          INPUT_PROMPT: ${{ inputs.prompt }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_TOKENS: ${{ inputs.trigger_tokens }}
        run: |
          set -euo pipefail
          if [[ -n "${EVENT_JSON}" ]]; then
            if jq -e '.label != null' >/dev/null <<<"${EVENT_JSON}"; then
              agents="$(jq -r '
                if (.pull_request.author_association | IN("OWNER", "MEMBER", "COLLABORATOR")) and .label.name == "review-all" then "opencode,junie,gemini,copilot"
                elif (.pull_request.author_association | IN("OWNER", "MEMBER", "COLLABORATOR")) and .label.name == "review-opencode" then "opencode"
                elif (.pull_request.author_association | IN("OWNER", "MEMBER", "COLLABORATOR")) and .label.name == "review-junie" then "junie"
                elif (.pull_request.author_association | IN("OWNER", "MEMBER", "COLLABORATOR")) and .label.name == "review-gemini" then "gemini"
                elif (.pull_request.author_association | IN("OWNER", "MEMBER", "COLLABORATOR")) and .label.name == "review-copilot" then "copilot"
                elif .pull_request.author_association == null and (.sender.type != "Bot") and .label.name == "review-all" then "opencode,junie,gemini,copilot"
                elif .pull_request.author_association == null and (.sender.type != "Bot") and .label.name == "review-opencode" then "opencode"
                elif .pull_request.author_association == null and (.sender.type != "Bot") and .label.name == "review-junie" then "junie"
                elif .pull_request.author_association == null and (.sender.type != "Bot") and .label.name == "review-gemini" then "gemini"
                elif .pull_request.author_association == null and (.sender.type != "Bot") and .label.name == "review-copilot" then "copilot"
                else "" end
              ' <<<"${EVENT_JSON}")"
              prompt=""
              pr_number="$(jq -r '.pull_request.number' <<<"${EVENT_JSON}")"
              tokens=""
            else
              agents="$(jq -r '
                if (.issue.pull_request != null) and ((.comment.author_association | IN("OWNER", "MEMBER", "COLLABORATOR")) or (.repository.owner.login == .comment.user.login) or (.repository.owner.login == .sender.login)) then
                  .comment.body as $body |
                  [
                    (if ($body | test("(^|[^[:alnum:]_])/opencode([^[:alnum:]_]|$)")) or ($body | test("(^|[^[:alnum:]_])@opencode([^[:alnum:]_]|$)")) then "opencode" else empty end),
                    (if ($body | test("(^|[^[:alnum:]_])/oc([^[:alnum:]_]|$)")) or ($body | test("(^|[^[:alnum:]_])@oc([^[:alnum:]_]|$)")) then "opencode" else empty end),
                    (if ($body | test("(^|[^[:alnum:]_])@junie-agent([^[:alnum:]_]|$)")) then "junie" else empty end),
                    (if ($body | test("(^|[^[:alnum:]_])@gemini-cli([^[:alnum:]_]|$)")) then "gemini" else empty end),
                    (if ($body | test("(^|[^[:alnum:]_])@junie([^[:alnum:]_]|$)")) then "junie" else empty end),
                    (if ($body | test("(^|[^[:alnum:]_])@gemini([^[:alnum:]_]|$)")) then "gemini" else empty end),
                    (if ($body | test("(^|[^[:alnum:]_])@copilot([^[:alnum:]_]|$)")) then "copilot" else empty end)
                  ] | unique | join(",")
                elif (.issue == null) and ((.comment.author_association | IN("OWNER", "MEMBER", "COLLABORATOR")) or (.repository.owner.login == .comment.user.login) or (.repository.owner.login == .sender.login)) then
                  .comment.body as $body |
                  [
                    (if ($body | test("(^|[^[:alnum:]_])/opencode([^[:alnum:]_]|$)")) or ($body | test("(^|[^[:alnum:]_])@opencode([^[:alnum:]_]|$)")) then "opencode" else empty end),
                    (if ($body | test("(^|[^[:alnum:]_])/oc([^[:alnum:]_]|$)")) or ($body | test("(^|[^[:alnum:]_])@oc([^[:alnum:]_]|$)")) then "opencode" else empty end),
                    (if ($body | test("(^|[^[:alnum:]_])@junie-agent([^[:alnum:]_]|$)")) then "junie" else empty end),
                    (if ($body | test("(^|[^[:alnum:]_])@gemini-cli([^[:alnum:]_]|$)")) then "gemini" else empty end),
                    (if ($body | test("(^|[^[:alnum:]_])@junie([^[:alnum:]_]|$)")) then "junie" else empty end),
                    (if ($body | test("(^|[^[:alnum:]_])@gemini([^[:alnum:]_]|$)")) then "gemini" else empty end),
                    (if ($body | test("(^|[^[:alnum:]_])@copilot([^[:alnum:]_]|$)")) then "copilot" else empty end)
                  ] | unique | join(",")
                else "" end
              ' <<<"${EVENT_JSON}")"
              prompt="$(jq -r '
                if ((.issue.pull_request != null) or (.issue == null)) and ((.comment.author_association | IN("OWNER", "MEMBER", "COLLABORATOR")) or (.repository.owner.login == .comment.user.login) or (.repository.owner.login == .sender.login)) then
                  .comment.body
                  | gsub("(^|[[:space:]])@junie-agent(,[[:space:]]*|[[:space:]]+|$)"; " ")
                  | gsub("(^|[[:space:]])@gemini-cli(,[[:space:]]*|[[:space:]]+|$)"; " ")
                  | gsub("(^|[[:space:]])/opencode(,[[:space:]]*|[[:space:]]+|$)"; " ")
                  | gsub("(^|[[:space:]])@opencode(,[[:space:]]*|[[:space:]]+|$)"; " ")
                  | gsub("(^|[[:space:]])@junie(,[[:space:]]*|[[:space:]]+|$)"; " ")
                  | gsub("(^|[[:space:]])@gemini(,[[:space:]]*|[[:space:]]+|$)"; " ")
                  | gsub("(^|[[:space:]])@copilot(,[[:space:]]*|[[:space:]]+|$)"; " ")
                  | gsub("(^|[[:space:]])/oc(,[[:space:]]*|[[:space:]]+|$)"; " ")
                  | gsub("(^|[[:space:]])@oc(,[[:space:]]*|[[:space:]]+|$)"; " ")
                  | gsub("^[[:space:]]+|[[:space:]]+$"; "")
                  | gsub("[[:space:]]{2,}"; " ")
                else "" end
              ' <<<"${EVENT_JSON}")"
              pr_number="$(jq -r '(.issue.number // .pull_request.number)' <<<"${EVENT_JSON}")"
              tokens="$(jq -r '.comment.body | [
                (if test("(^|[^[:alnum:]_])@junie-agent([^[:alnum:]_]|$)") then "@junie-agent" else empty end),
                (if test("(^|[^[:alnum:]_])@junie([^[:alnum:]_]|$)") then "@junie" else empty end),
                (if test("(^|[^[:alnum:]_])/opencode([^[:alnum:]_]|$)") then "/opencode" else empty end),
                (if test("(^|[^[:alnum:]_])@opencode([^[:alnum:]_]|$)") then "@opencode" else empty end),
                (if test("(^|[^[:alnum:]_])/oc([^[:alnum:]_]|$)") then "/oc" else empty end),
                (if test("(^|[^[:alnum:]_])@oc([^[:alnum:]_]|$)") then "@oc" else empty end),
                (if test("(^|[^[:alnum:]_])@gemini-cli([^[:alnum:]_]|$)") then "@gemini-cli" else empty end),
                (if test("(^|[^[:alnum:]_])@gemini([^[:alnum:]_]|$)") then "@gemini" else empty end),
                (if test("(^|[^[:alnum:]_])@copilot([^[:alnum:]_]|$)") then "@copilot" else empty end)
              ] | unique | join(",")' <<<"${EVENT_JSON}")"
            fi
          else
            agents="${INPUT_AGENTS}"
            prompt="${INPUT_PROMPT}"
            pr_number="${INPUT_PR_NUMBER}"
            tokens="${INPUT_TOKENS}"
            if [[ -z "${tokens}" ]]; then
              IFS=',' read -ra requested_agents <<<"${agents}"
              tokens=""
              for agent in "${requested_agents[@]}"; do
                [[ -z "${agent}" ]] && continue
                tokens+="${tokens:+,}@${agent}"
              done
            fi
          fi
          delim="PROMPT_$(openssl rand -hex 8 2>/dev/null || echo "${RANDOM}${RANDOM}")"
          {
            printf 'agents=%s\n' "${agents}"
            printf 'pr_number=%s\n' "${pr_number}"
            printf 'tokens=%s\n' "${tokens}"
            printf 'prompt<<%s\n%s\n%s\n' "${delim}" "${prompt}" "${delim}"
          } >> "${GITHUB_OUTPUT}"

  # Review job runs untrusted PR content. The dispatcher gates triggers to
  # trusted repo actors; keep provider keys minimal and never add write
  # permissions beyond pull-requests/issues here.
  opencode:
    needs: parse
    if: needs.parse.outputs.agents != '' && contains(format(',{0},', needs.parse.outputs.agents), ',opencode,')
    runs-on: ubuntu-latest
    # OpenCode may push a requested fix; reviewer-only lanes remain read-only.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ github.token }}
          persist-credentials: true
          fetch-depth: 1
          ref: ${{ (needs.parse.outputs.pr_number != '' && format('refs/pull/{0}/merge', needs.parse.outputs.pr_number)) || '' }}
      # Attribute agent commits and avoid runners' missing git identity failure.
      # Downstream repositories may override this with their preferred identity.
      - name: Configure git identity for agent commits
        run: |
          git config --local user.name "opencode-agent[bot]"
          git config --local user.email "opencode-agent[bot]@users.noreply.github.com"
      # Downstream callers need this trusted checkout for shared review assets.
      - name: Checkout trusted review assets
        uses: actions/checkout@v7
        with:
          repository: randytarampi/dotfiles
          ref: main
          path: __TRUSTED_DOTFILES__
          persist-credentials: false
          fetch-depth: 1
      - name: Cache codegraph index
        uses: actions/cache@v6
        with:
          path: .codegraph
          key: codegraph-${{ runner.os }}-${{ github.repository }}-${{ github.sha }}
          restore-keys: |
            codegraph-${{ runner.os }}-${{ github.repository }}-
      - name: Install codegraph + build index
        run: bash __TRUSTED_DOTFILES__/scripts/ci-codegraph.sh
      - name: Install code-review skill
        run: mkdir -p .opencode/skills/code-review && cp __TRUSTED_DOTFILES__/.github/skills/code-review/SKILL.md .opencode/skills/code-review/SKILL.md
      - name: Load review prompt
        run: |
          prompt_file="__TRUSTED_DOTFILES__/configs/review/code-review-prompt.md"
          delim=""
          for _ in {1..5}; do
            delim="REVIEW_PROMPT_$(openssl rand -hex 8)"
            if ! grep -Fq -- "$delim" "$prompt_file"; then
              break
            fi
            delim=""
          done
          if [[ -z "$delim" ]]; then
            echo "Unable to select a safe review prompt delimiter." >&2
            exit 1
          fi
          {
            printf 'CODE_REVIEW_PROMPT<<%s\n' "$delim"
            cat "$prompt_file"
            printf '%s\n' "$delim"
          } >> "$GITHUB_ENV"
      # OpenCode may push a requested fix; strip the trusted checkout's git
      # include config so submodule scanning does not error on its directory.
      - name: Remove trusted checkout git include config
        run: |
          git config --local --name-only --get-regexp '^includeif\.gitdir:.*/__TRUSTED_DOTFILES__' |
            while IFS= read -r key; do git config --local --unset-all "$key" || true; done
      - name: Run OpenCode review
        uses: anomalyco/opencode/github@16747470f976aca3d362ad730bcd3fe82ecc2c9a # v1.18.29
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          OPENCODE_CONFIG: ${{ github.workspace }}/__TRUSTED_DOTFILES__/configs/opencode/ci/opencode.json
        with:
          model: opencode/big-pickle
          use_github_token: "true"
          prompt: |
            ${{ needs.parse.outputs.prompt != '' && format('{0}

            ---

            {1}', needs.parse.outputs.prompt, env.CODE_REVIEW_PROMPT) || env.CODE_REVIEW_PROMPT }}

  junie:
    needs: parse
    if: needs.parse.outputs.agents != '' && contains(format(',{0},', needs.parse.outputs.agents), ',junie,')
    runs-on: ubuntu-latest
    # Junie may push a requested fix; reviewer-only lanes remain read-only.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ github.token }}
          persist-credentials: true
          fetch-depth: 1
      # Attribute agent commits and avoid runners' missing git identity failure.
      # Downstream repositories may override this with their preferred identity.
      - name: Configure git identity for agent commits
        run: |
          git config --local user.name "junie-agent[bot]"
          git config --local user.email "junie-agent[bot]@users.noreply.github.com"
      - name: Checkout trusted review assets
        uses: actions/checkout@v7
        with:
          repository: randytarampi/dotfiles
          ref: main
          path: __TRUSTED_DOTFILES__
          persist-credentials: false
          fetch-depth: 1
      - name: Load review prompt
        run: |
          prompt_file="__TRUSTED_DOTFILES__/configs/review/code-review-prompt.md"
          delim=""
          for _ in {1..5}; do
            delim="REVIEW_PROMPT_$(openssl rand -hex 8)"
            if ! grep -Fq -- "$delim" "$prompt_file"; then break; fi
            delim=""
          done
          if [[ -z "$delim" ]]; then exit 1; fi
          {
            printf 'CODE_REVIEW_PROMPT<<%s\n' "$delim"
            cat "$prompt_file"
            printf '%s\n' "$delim"
          } >> "$GITHUB_ENV"
      - name: Remove trusted checkout git include config
        run: |
          git config --local --name-only --get-regexp '^includeif\.gitdir:.*/__TRUSTED_DOTFILES__' |
            while IFS= read -r key; do git config --local --unset-all "$key" || true; done
      - uses: JetBrains/junie-github-action@v1
        with:
          junie_api_key: ${{ secrets.JUNIE_API_KEY }}
          prompt: ${{ needs.parse.outputs.prompt != '' && needs.parse.outputs.prompt || env.CODE_REVIEW_PROMPT }}
          attach_github_context_to_custom_prompt: "true"
          use_single_comment: "true"
          # silent_mode gates Junie's bundled commit/push steps (action.yml:407-426),
          # so it stays unset to keep the commit-and-push capability.
          # skip_feedback suppresses only the action's own status comments
          # (action.yml:441,469); the notify job posts our standardized ones.
          skip_feedback: "true"

  gemini:
    needs: parse
    if: needs.parse.outputs.agents != '' && contains(format(',{0},', needs.parse.outputs.agents), ',gemini,')
    runs-on: ubuntu-latest
    # Gemini may push a requested fix like the OpenCode/Junie lanes.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ github.token }}
          persist-credentials: true
          fetch-depth: 1
          ref: ${{ (needs.parse.outputs.pr_number != '' && format('refs/pull/{0}/merge', needs.parse.outputs.pr_number)) || '' }}
      # Attribute agent commits and avoid runners' missing git identity failure.
      # Downstream repositories may override this with their preferred identity.
      - name: Configure git identity for agent commits
        run: |
          git config --local user.name "gemini-agent[bot]"
          git config --local user.email "gemini-agent[bot]@users.noreply.github.com"

      # Downstream callers need this trusted checkout for shared review assets.
      - name: Checkout trusted review assets
        uses: actions/checkout@v7
        with:
          repository: randytarampi/dotfiles
          ref: main
          path: __TRUSTED_DOTFILES__
          persist-credentials: false
          fetch-depth: 1
      - name: Load review prompt
        run: |
          prompt_file="__TRUSTED_DOTFILES__/configs/review/code-review-prompt.md"
          delim=""
          for _ in {1..5}; do
            delim="REVIEW_PROMPT_$(openssl rand -hex 8)"
            if ! grep -Fq -- "$delim" "$prompt_file"; then
              break
            fi
            delim=""
          done
          if [[ -z "$delim" ]]; then
            echo "Unable to select a safe review prompt delimiter." >&2
            exit 1
          fi
          {
            printf 'CODE_REVIEW_PROMPT<<%s\n' "$delim"
            cat "$prompt_file"
            printf '%s\n' "$delim"
          } >> "$GITHUB_ENV"
      # GEMINI_CLI_TRUST_WORKSPACE bypasses the workspace-trust prompt; the action's --yolo covers tool approvals (docs: run-gemini-cli trust-guidance.md).
      # Gemini may push a requested fix; strip the trusted checkout's git
      # include config so submodule scanning does not error on its directory.
      - name: Remove trusted checkout git include config
        run: |
          git config --local --name-only --get-regexp '^includeif\.gitdir:.*/__TRUSTED_DOTFILES__' |
            while IFS= read -r key; do git config --local --unset-all "$key" || true; done
      - id: gemini
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            ${{ needs.parse.outputs.prompt != '' && format('{0}

            ---

            {1}', needs.parse.outputs.prompt, env.CODE_REVIEW_PROMPT) || env.CODE_REVIEW_PROMPT }}
      - name: Post Gemini review
        if: steps.gemini.outputs.summary != '' && needs.parse.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.parse.outputs.pr_number }}
          GEMINI_SUMMARY: ${{ steps.gemini.outputs.summary }}
        run: |
          review_file="${RUNNER_TEMP}/gemini-review.md"
          printf '%s' "${GEMINI_SUMMARY}" > "${review_file}"
          gh pr comment "${PR_NUMBER}" --body-file "${review_file}"

  copilot:
    needs: parse
    if: needs.parse.outputs.agents != '' && contains(format(',{0},', needs.parse.outputs.agents), ',copilot,')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Request Copilot review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.parse.outputs.pr_number }}
        run: |
          set -euo pipefail
          if [[ -z "${PR_NUMBER}" ]]; then
            echo "Cannot request Copilot review: PR number is empty." >&2
            exit 1
          fi
          response_file="${RUNNER_TEMP}/copilot-review-response.txt"
          if ! gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/requested_reviewers" \
            -f 'reviewers[]=copilot-pull-request-reviewer[bot]' >"${response_file}" 2>&1; then
            response="$(<"${response_file}")"
            if grep -Eiq 'already[[:space:]]+(been[[:space:]]+)?requested|reviewer[^[:cntrl:]]*already' <<<"${response}"; then
              echo "Copilot review was already requested; continuing."
            else
              printf '%s\n' "${response}" >&2
              exit 1
            fi
          fi

  notify:
    if: always()
    needs: [parse, opencode, junie, gemini, copilot]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - id: junie_app_token
        if: ${{ env.JUNIE_APP_ID != '' && env.JUNIE_APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@v3
        env:
          JUNIE_APP_ID: ${{ secrets.JUNIE_APP_ID }}
          JUNIE_APP_PRIVATE_KEY: ${{ secrets.JUNIE_APP_PRIVATE_KEY }}
        with:
          app-id: ${{ secrets.JUNIE_APP_ID }}
          private-key: ${{ secrets.JUNIE_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write
      - id: opencode_app_token
        if: ${{ env.OPENCODE_APP_ID != '' && env.OPENCODE_APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@v3
        env:
          OPENCODE_APP_ID: ${{ secrets.OPENCODE_APP_ID }}
          OPENCODE_APP_PRIVATE_KEY: ${{ secrets.OPENCODE_APP_PRIVATE_KEY }}
        with:
          app-id: ${{ secrets.OPENCODE_APP_ID }}
          private-key: ${{ secrets.OPENCODE_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write
      - id: gemini_app_token
        if: ${{ env.GEMINI_APP_ID != '' && env.GEMINI_APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@v3
        env:
          GEMINI_APP_ID: ${{ secrets.GEMINI_APP_ID }}
          GEMINI_APP_PRIVATE_KEY: ${{ secrets.GEMINI_APP_PRIVATE_KEY }}
        with:
          app-id: ${{ secrets.GEMINI_APP_ID }}
          private-key: ${{ secrets.GEMINI_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write
      - id: fallback_app_token
        if: ${{ env.APP_ID != '' && env.APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@v3
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write
      - name: Update standardized agent status comments
        env:
          GH_TOKEN: ${{ github.token }}
          FALLBACK_TOKEN: ${{ github.token }}
          JUNIE_BOT_TOKEN: ${{ secrets.JUNIE_BOT_TOKEN }}
          OPENCODE_BOT_TOKEN: ${{ secrets.OPENCODE_BOT_TOKEN }}
          GEMINI_BOT_TOKEN: ${{ secrets.GEMINI_BOT_TOKEN }}
          JUNIE_APP_TOKEN: ${{ steps.junie_app_token.outputs.token }}
          OPENCODE_APP_TOKEN: ${{ steps.opencode_app_token.outputs.token }}
          GEMINI_APP_TOKEN: ${{ steps.gemini_app_token.outputs.token }}
          FALLBACK_APP_TOKEN: ${{ steps.fallback_app_token.outputs.token }}
          PR_NUMBER: ${{ needs.parse.outputs.pr_number }}
          AGENTS: ${{ needs.parse.outputs.agents }}
          TOKENS: ${{ needs.parse.outputs.tokens }}
          OPCODE_RESULT: ${{ needs.opencode.result }}
          JUNIE_RESULT: ${{ needs.junie.result }}
          GEMINI_RESULT: ${{ needs.gemini.result }}
          COPILOT_RESULT: ${{ needs.copilot.result }}
        run: |
          set -euo pipefail
          IFS=',' read -ra agents <<<"${AGENTS}"
          IFS=',' read -ra tokens <<<"${TOKENS:-}"
          for i in "${!agents[@]}"; do
            agent="${agents[$i]}"
            token=""
            case "${agent}" in
              junie) token="$(printf '%s\n' "${tokens[@]}" | grep -E '^@junie(-agent)?$' | sort -r | head -n 1 || true)" ;;
              opencode) token="$(printf '%s\n' "${tokens[@]}" | grep -E '^(/opencode|@opencode|/oc|@oc)$' | head -n 1 || true)" ;;
              gemini) token="$(printf '%s\n' "${tokens[@]}" | grep -E '^@gemini(-cli)?$' | sort -r | head -n 1 || true)" ;;
              copilot) token="$(printf '%s\n' "${tokens[@]}" | grep '^@copilot$' | head -n 1 || true)" ;;
            esac
            token="${token:-@${agent}}"
            case "${agent}" in
              opencode) result="${OPCODE_RESULT}" ;;
              junie) result="${JUNIE_RESULT}" ;;
              gemini) result="${GEMINI_RESULT}" ;;
              copilot) result="${COPILOT_RESULT}" ;;
              *) continue ;;
            esac
            marker="<!-- agent-review:${agent} -->"
            case "${agent}" in
              junie) poster_token="${JUNIE_BOT_TOKEN:-${JUNIE_APP_TOKEN:-${FALLBACK_APP_TOKEN:-${FALLBACK_TOKEN}}}}" ;;
              opencode) poster_token="${OPENCODE_BOT_TOKEN:-${OPENCODE_APP_TOKEN:-${FALLBACK_APP_TOKEN:-${FALLBACK_TOKEN}}}}" ;;
              gemini) poster_token="${GEMINI_BOT_TOKEN:-${GEMINI_APP_TOKEN:-${FALLBACK_APP_TOKEN:-${FALLBACK_TOKEN}}}}" ;;
              *) poster_token="${FALLBACK_TOKEN}" ;;
            esac
            if [[ "${agent}" == "copilot" && "${result}" == "success" ]]; then
              status="Copilot review requested."
            elif [[ "${result}" == "success" ]]; then
              case "${agent}" in
                opencode) status="OpenCode review completed — see the agent's review comment above." ;;
                junie) status="Junie review completed — see the agent's comment above." ;;
                gemini) status="Gemini review completed — see the agent's comment above." ;;
                *) status="${agent} review completed." ;;
              esac
            else
              status="${token} review FAILED."
            fi
            body="$(printf '%s\n\n%s\n\n%s' \
              "${marker}" "${status}" \
              "See the [workflow logs](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).")"
            comment_id="$(GH_TOKEN="${poster_token}" gh api --paginate "/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | head -n 1 || true)"
            if [[ -n "${comment_id}" ]]; then
              GH_TOKEN="${poster_token}" gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -f body="${body}" >/dev/null
            else
              GH_TOKEN="${poster_token}" gh api --method POST "/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="${body}" >/dev/null
            fi
          done
