# Disposable same-repository validation of PR #89's reusable workflow.
# Remove the branch after validation; this workflow is not intended for main.
name: Review publisher PR89 smoke
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  # The reusable workflow declares this on its Copilot job, even if we select only OpenCode.
  # GitHub validates the full nested permissions graph before dispatching jobs.
  pull-requests: write
jobs:
  smoke:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'test/review-publisher-exact-sha'
    uses: randytarampi/dotfiles/.github/workflows/agentic-review.yml@083ecd3fee363148170e300095186f7b45dc508e
    with:
      agents: opencode
      pr_number: ${{ github.event.pull_request.number }}
      trusted_ref: 87a17ef5ed0cfd780efef3cbefa218b109d8d000
    secrets: inherit
